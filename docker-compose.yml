version: '3.8'

services:
  agroprocessing:
    build:
      context: ./AgroProcessing
      dockerfile: Dockerfile
    container_name: agroprocessing-app
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database on host
      - ./data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  agroprocessing-data:
    driver: local
